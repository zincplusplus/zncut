[project]
name = "zncut"
version = "0.2.0"
description = "The fastest command line tool for removing ads from pre-downloaded YouTube videos with frame-accurate cuts"
readme = "readme.md"
license = "MIT"
requires-python = ">=3.9"

[project.scripts]
zncut = "zncut:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["zncut.py"]
